services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_finance_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_docker:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_docker:
